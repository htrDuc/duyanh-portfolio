<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiều Khánh Duy Anh · Skills</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=IBM+Plex+Mono&family=Inter:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="skills" id="top">

<!-- Figma: Skills / Frame 26 (dark) -->
<main class="skills">
  <div class="topbar topbar--page" data-partial="topbar"></div>
  <div class="skills__inner">
    <h1 class="skills__title" data-i18n="skills.title"></h1>
    <p class="skills__lead" data-i18n="skills.lead"></p>

    <!-- Key numbers, count up when scrolled into view -->
    <ul class="stats" data-stats>
      <li class="stat" data-stat="years"><strong class="stat__num">0</strong><span class="stat__label" data-i18n="stat.years"></span><span class="stat__src">CV</span></li>
      <li class="stat" data-stat="views"><strong class="stat__num">0</strong><span class="stat__label" data-i18n="stat.views"></span><span class="stat__src">Portfolio.pdf · p.13</span></li>
      <li class="stat" data-stat="revenue"><strong class="stat__num">0</strong><span class="stat__label" data-i18n="stat.revenue"></span><span class="stat__src">CV</span></li>
      <li class="stat" data-stat="subs"><strong class="stat__num">0</strong><span class="stat__label" data-i18n="stat.subs"></span><span class="stat__src">CV</span></li>
    </ul>

    <!-- Skill cards with logo tiles (Figma: Frontend / Frame 46 cards) -->
    <div class="bento">
      <article class="skill-card skill-card--wide" data-spot>
        <ul class="tiles">
          <li class="tile" data-tip="Premiere Pro"><img src="assets/icons/adobepremierepro.svg" alt="Premiere Pro"></li>
          <li class="tile" data-tip="CapCut PC/Mobile" data-icon="scissors"></li>
          <li class="tile" data-tip="Veo 3"><img src="assets/icons/google.svg" alt="Veo 3"></li>
          <li class="tile" data-i18n-tip="skill.video.p4" data-icon="film"></li>
        </ul>
        <h2 data-i18n="skill.video.title"></h2>
        <p data-i18n="skill.video.desc"></p>
      </article>

      <article class="skill-card" data-spot>
        <ul class="tiles">
          <li class="tile" data-tip="TikTok"><img src="assets/icons/tiktok.svg" alt="TikTok"></li>
          <li class="tile" data-tip="YouTube"><img src="assets/icons/youtube.svg" alt="YouTube"></li>
          <li class="tile" data-tip="Facebook"><img src="assets/icons/facebook.svg" alt="Facebook"></li>
          <li class="tile" data-tip="Shopee"><img src="assets/icons/shopee.svg" alt="Shopee"></li>
        </ul>
        <h2 data-i18n="skill.content.title"></h2>
        <p data-i18n="skill.content.desc"></p>
      </article>

      <article class="skill-card" data-spot>
        <ul class="tiles">
          <li class="tile" data-tip="ChatGPT"><img src="assets/icons/openai.svg" alt="ChatGPT"></li>
          <li class="tile" data-tip="Grok" data-icon="sparkle"></li>
          <li class="tile" data-tip="Veo"><img src="assets/icons/googlegemini.svg" alt="Veo"></li>
          <li class="tile" data-tip="Jimeng (ByteDance)"><img src="assets/icons/bytedance.svg" alt="Jimeng"></li>
        </ul>
        <h2 data-i18n="skill.ai.title"></h2>
        <p data-i18n="skill.ai.desc"></p>
      </article>

      <article class="skill-card" data-spot>
        <ul class="tiles">
          <li class="tile" data-tip="Google Sheets"><img src="assets/icons/googlesheets.svg" alt="Google Sheets"></li>
          <li class="tile" data-tip="Meta Business Suite"><img src="assets/icons/meta.svg" alt="Meta Business Suite"></li>
          <li class="tile" data-i18n-tip="skill.content.p3" data-icon="chart"></li>
        </ul>
        <h2 data-i18n="skill.data.title"></h2>
        <p data-i18n="skill.data.desc"></p>
      </article>

      <article class="skill-card" data-spot>
        <ul class="soft">
          <li><span class="tile" data-icon="team"></span><span data-i18n="skill.soft.p1"></span></li>
          <li><span class="tile" data-icon="link"></span><span data-i18n="skill.soft.p2"></span></li>
          <li><span class="tile" data-icon="clock"></span><span data-i18n="skill.soft.p3"></span></li>
          <li><span class="tile" data-icon="bolt"></span><span data-i18n="skill.soft.p4"></span></li>
          <li><span class="tile" data-icon="globe"></span><span data-i18n="skill.soft.p5"></span></li>
        </ul>
        <h2 data-i18n="skill.soft.title"></h2>
        <p data-i18n="skill.soft.desc"></p>
      </article>
    </div>

    <!-- Interactive workflow -->
    <section class="flow" data-flow>
      <div class="flow__head">
        <h2 class="flow__title" data-i18n="flow.title"></h2>
        <p class="flow__hint mono" data-i18n="flow.hint"></p>
      </div>
      <div class="flow__steps" role="tablist"></div>
      <div class="flow__panel" role="tabpanel" aria-live="polite"></div>
    </section>

    <div class="bento bento--2">
      <article class="skill-card skill-card--media" id="education" data-spot>
        <img src="assets/img/edu-it.jpg" alt="">
        <p class="mono">2021 - 2023</p>
        <h2 data-i18n="skill.edu.title"></h2>
        <p data-i18n="skill.edu.desc"></p>
      </article>
      <article class="skill-card skill-card--media" data-spot>
        <img src="assets/img/about.jpg" alt="">
        <p class="mono">2021 - 2026</p>
        <h2 data-i18n="skill.cert.title"></h2>
        <p data-i18n="skill.cert.desc"></p>
      </article>
    </div>
  </div>
</main>

<nav class="dock" data-partial="dock"></nav>

<!-- Figma: Skills / Frame 29 -->
<section class="section contact" id="contact" data-partial="contact"></section>
<dialog class="lightbox" data-partial="lightbox"></dialog>

<script src="i18n.js"></script>
<script src="main.js"></script>
<script src="skills.js"></script>
</body>
</html>
